name: CI Pipeline - Python and Docker

# This triggers the pipeline on every push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    # The runner is a fresh Ubuntu virtual machine provided by GitHub
    runs-on: ubuntu-latest

    steps:
    # Download our code into the VM
    - name: Checkout code
      uses: actions/checkout@v4

    # Install Python in the VM
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Install dependencies (Flask, SQLAlchemy, Pytest)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    # Run the automated tests
    - name: Run tests with Pytest
      run: |
        cd app
        pytest -v

    # Build the Docker image to prove it works
    - name: Build Docker Image
      run: docker build -t devops-lab-api:latest ./app